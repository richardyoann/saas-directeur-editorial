name: Studio browser journeys
# Legacy optional GitHub-hosted check: manual only; normal QA runs on PC.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test-only browser driver
        run: python -m pip install -r requirements.txt playwright==1.58.0
      - name: Run five real Chromium journeys with isolated fake API
        env:
          STUDIO_BROWSER_TESTS: 'yes'
        run: python -m unittest discover -s browser_checks -p 'test_studio_browser.py' -v
