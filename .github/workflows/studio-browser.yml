name: Studio browser journeys
# Local attested CI is authoritative; hosted execution is explicit opt-in only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install test-only browser driver
        run: python -m pip install -r requirements.txt playwright==1.58.0
      - name: Run five real Chromium journeys with isolated fake API
        env:
          STUDIO_BROWSER_TESTS: 'yes'
        run: python -m unittest discover -s browser_checks -p 'test_studio_browser.py' -v
