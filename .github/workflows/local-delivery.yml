name: Private PC delivery
on:
  workflow_run:
    workflows: [Full regression]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: editorial-pc-delivery
  cancel-in-progress: false
jobs:
  install-and-live:
    if: >-
      vars.LOCAL_PC_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux, editorial-pc]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: po_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: po_test
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U po_test -d po_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Prepare test dependencies and disposable DB
        env:
          TRACE_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt 'psycopg[binary]==3.3.6'
          .venv/bin/python scripts/prepare_test_database.py
      - name: Candidate install, regression, real HTTP and rollback
        env:
          RELEASE_ROOT: ${{ vars.LOCAL_RELEASE_ROOT }}
          CONFIG_PATH: ${{ vars.LOCAL_CONFIG_PATH }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PO_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
          PO_ALLOW_TEST_MIGRATION: 'yes'
          TRACE_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
        run: >-
          .venv/bin/python scripts/deploy_local.py
          --root "$RELEASE_ROOT" --config "$CONFIG_PATH" --sha "$EXPECTED_SHA"
