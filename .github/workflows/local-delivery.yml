name: Private PC delivery
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact 40-character main commit approved for private delivery'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: editorial-pc-delivery
  cancel-in-progress: false
jobs:
  install-and-live:
    if: >-
      vars.LOCAL_PC_ENABLED == 'true' &&
      vars.LOCAL_PC_APPROVED_SHA != '' &&
      vars.LOCAL_PC_APPROVED_SHA == inputs.approved_sha &&
      github.ref == 'refs/heads/main' &&
      inputs.approved_sha == github.sha
    runs-on: [self-hosted, Linux, editorial-pc]
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: po_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: po_test
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U po_test -d po_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact SHA approval before installation
        env:
          APPROVED_SHA: ${{ vars.LOCAL_PC_APPROVED_SHA }}
          EXPECTED_SHA: ${{ inputs.approved_sha }}
          LOCAL_PC_ENABLED: ${{ vars.LOCAL_PC_ENABLED }}
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$LOCAL_PC_ENABLED" == "true" ]] || exit 1
          [[ "$APPROVED_SHA" == "$EXPECTED_SHA" ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
      - name: Prepare isolated Python 3.14 and disposable DB
        env:
          TRACE_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
        run: |
          python3.14 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt 'psycopg[binary]==3.3.6' pip-audit==2.10.1
          .venv/bin/python scripts/prepare_test_database.py
      - name: Independent deterministic quality gate (not OpenCode)
        env:
          EXPECTED_SHA: ${{ inputs.approved_sha }}
          PO_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
          TRACE_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
          PO_ALLOW_TEST_MIGRATION: 'yes'
          LOCAL_QUALITY_REPORT: ${{ runner.temp }}/arvor-quality-${{ inputs.approved_sha }}.json
        run: >-
          .venv/bin/python scripts/local_quality_gate.py
          --sha "$EXPECTED_SHA" --report "$LOCAL_QUALITY_REPORT"
      - name: Candidate install, HTTP checks and rollback
        env:
          RELEASE_ROOT: ${{ vars.LOCAL_RELEASE_ROOT }}
          CONFIG_PATH: ${{ vars.LOCAL_CONFIG_PATH }}
          EXPECTED_SHA: ${{ inputs.approved_sha }}
          LOCAL_PC_APPROVED_SHA: ${{ vars.LOCAL_PC_APPROVED_SHA }}
          LOCAL_PC_ENABLED: ${{ vars.LOCAL_PC_ENABLED }}
          LOCAL_QUALITY_REPORT: ${{ runner.temp }}/arvor-quality-${{ inputs.approved_sha }}.json
          GITHUB_TOKEN: ${{ github.token }}
          PO_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
          PO_ALLOW_TEST_MIGRATION: 'yes'
          TRACE_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
        run: >-
          .venv/bin/python scripts/deploy_local.py
          --root "$RELEASE_ROOT" --config "$CONFIG_PATH" --sha "$EXPECTED_SHA"
