name: Automated CI triage and release evidence
# Local attested CI is authoritative; hosted execution is explicit opt-in only.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing completed GitHub run ID to inspect (no rerun)
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: ci-triage-manual-${{ inputs.run_id }}
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted main only (never execute PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Publish bounded failure triage or main release evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_PC_ENABLED: ${{ vars.LOCAL_PC_ENABLED }}
        run: python scripts/ci_status_report.py
