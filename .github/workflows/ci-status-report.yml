name: Automated CI triage and release evidence
on:
  workflow_run:
    workflows:
      - Full regression
      - Dependency security audit
      - Studio browser journeys
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: ci-triage-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true
jobs:
  report:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted main only (never execute PR head)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Publish bounded failure triage or main release evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_PC_ENABLED: ${{ vars.LOCAL_PC_ENABLED }}
        run: python scripts/ci_status_report.py
