name: Full regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: po_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: po_test
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U po_test -d po_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt 'psycopg[binary]==3.3.6'
      - name: Install offline video test prerequisite
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare disposable trace database when present
        env:
          TRACE_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
        run: python scripts/prepare_test_database.py
      - name: Check Studio JavaScript and Python syntax
        run: |
          node --check apps/web/studio.js
          node --check apps/web/arvor_reference.js
          node --check apps/web/arvor_next.js
          python -m py_compile apps/api/studio.py
      - name: All historical and new suites (skips fail)
        env:
          PO_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
          PO_ALLOW_TEST_MIGRATION: 'yes'
          TRACE_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
        run: python scripts/run_regression.py
      - name: Measure catalog and history query plans on temporary synthetic data
        env:
          PO_TEST_DATABASE_URL: postgresql://po_test:ephemeral_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/po_test
          PO_ALLOW_TEST_MIGRATION: 'yes'
        run: python scripts/benchmark_editorial_sql.py --rows 1200 --disposable

