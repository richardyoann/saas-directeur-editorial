name: Automated PR risk review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: risk-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  risk-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Inventory change risks without repo write access
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/ci_autonomy.py --base origin/main --head HEAD --sha "$REVIEW_HEAD_SHA"
      - name: Verify review algorithm tests
        run: python -m unittest tests.test_ci_autonomy tests.test_ci_status_report -v
