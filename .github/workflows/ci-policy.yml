name: CI supply-chain guardrails
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardrails:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on deprecated action runtimes, unpinned actions or moving runner image
        run: python3 scripts/ci_policy.py
      - name: Validate policy checker itself
        run: python3 -m unittest tests.test_ci_policy -v
