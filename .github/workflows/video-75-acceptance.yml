name: Synthetic 75s video acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-75-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install local-only video prerequisite
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate and verify 75s synthetic MP4, subtitles and dimensions
        run: python -m scripts.smoke_video_75
