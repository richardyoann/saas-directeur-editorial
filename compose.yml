services:
  postgres:
    image: postgres:16
    container_name: editorial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: editorial
      POSTGRES_USER: editorial
      POSTGRES_PASSWORD: editorial_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    # Not required by the current PostgreSQL-backed worker.
    # Opt in explicitly: docker compose --profile optional-redis up -d redis
    profiles: [optional-redis]
    image: redis:7-alpine
    container_name: editorial-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: editorial-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: editorial
      MINIO_ROOT_PASSWORD: editorial_dev_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
